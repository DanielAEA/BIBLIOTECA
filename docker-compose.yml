services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ciberbook-network

  ciberbook-predictivo:
    build:
      context: ./microservicio-predictivo
      dockerfile: Dockerfile
    image: daniel08escudero/ciberbook-predictivo:latest
    container_name: ciberbook-predictivo
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ciberbook-network

  backend:
    build:
      context: ./Backend/biblioteca
      dockerfile: Dockerfile
    image: daniel08escudero/ciberbook-backend:latest
    container_name: ciberbook-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/biblioteca
      - APP_BASE_URL=http://localhost:8080
      - APP_FRONT_URL=http://localhost:4200
      - APP_PREDICTIVO_URL=http://ciberbook-predictivo:8000/predecir
    depends_on:
      - mongodb
      - ciberbook-predictivo
    volumes:
      - ./uploads:/app/uploads
    networks:
      - ciberbook-network

  frontend:
    build:
      context: ./sistema-prestamos-frontend/frontend
      dockerfile: Dockerfile
    image: daniel08escudero/ciberbook-frontend:latest
    container_name: ciberbook-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ciberbook-network

networks:
  ciberbook-network:
    driver: bridge

volumes:
  mongodb_data:
