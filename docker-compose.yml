services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./Backend/biblioteca
      dockerfile: Dockerfile
    image: daniel08escudero/ciberbook-backend:latest
    container_name: ciberbook-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/biblioteca
      - APP_BASE_URL=http://localhost:8080
      - APP_FRONT_URL=http://localhost:4200
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./sistema-prestamos-frontend/frontend
      dockerfile: Dockerfile
    image: daniel08escudero/ciberbook-frontend:latest
    container_name: ciberbook-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
