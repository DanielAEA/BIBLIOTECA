services:
  # ============================================
  # Base de Datos MongoDB
  # ============================================
  db:
    image: mongo:latest
    container_name: biblioteca-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - biblioteca-data:/data/db
    networks:
      - biblioteca-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================
  # Backend - Spring Boot
  # ============================================
  backend:
    build:
      context: ./Backend/biblioteca
      dockerfile: Dockerfile
    container_name: biblioteca-backend
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://db:27017/biblioteca
      NGROK_API_HOST: ngrok
    ports:
      - "8080:8080"
    volumes:
      - biblioteca-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - biblioteca-network

  # ============================================
  # Frontend - Angular + Nginx
  # ============================================
  frontend:
    build:
      context: ./sistema-prestamos-frontend/frontend
      dockerfile: Dockerfile
    container_name: biblioteca-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - biblioteca-network

  # ============================================
  # Ngrok - Túnel público
  # ============================================
  ngrok:
    image: ngrok/ngrok:latest
    container_name: biblioteca-ngrok
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command:
      - "http"
      - "backend:8080"
    ports:
      - "4040:4040"
    depends_on:
      - frontend
    networks:
      - biblioteca-network

# ============================================
# Volúmenes persistentes
# ============================================
volumes:
  biblioteca-data:
    name: biblioteca-mongodb-data
  biblioteca-uploads:
    name: biblioteca-uploads

# ============================================
# Red compartida
# ============================================
networks:
  biblioteca-network:
    name: biblioteca-network
    driver: bridge
