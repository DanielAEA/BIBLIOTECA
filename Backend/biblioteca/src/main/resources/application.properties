spring.application.name=biblioteca
server.port=8080
server.address=0.0.0.0

# Configuración de MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/biblioteca}

# Habilitar recursos estáticos para servir contenido HTML correctamente
spring.web.resources.add-mappings=true

# Configuración para subida de archivos (PDFs)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# URL base para los códigos QR (si no se detecta ngrok)
app.base.url=${APP_BASE_URL:http://localhost:8080}
