server {
    listen 80;
    server_name localhost;

    # Servir archivos estáticos de Angular
    root /usr/share/nginx/html/browser;
    index index.html;

    # Proxy reverso para API del backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para archivos grandes (PDFs)
        client_max_body_size 50M;
    }

    # Proxy reverso para uploads (PDFs, imágenes)
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy reverso para autenticación
    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso para actuator (health checks)
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: cualquier ruta no encontrada redirige a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
