<div class="min-h-screen bg-slate-50 flex flex-col font-sans">
  <!-- Header -->
  <header class="bg-black text-white p-5 shadow-md flex items-center">
    <img src="/assets/logo-light.png" alt="Logo" class="h-8 w-auto mr-3">
    <div class="flex flex-col">
      <h1 class="text-lg font-bold leading-none">CiberBook</h1>
      <span class="text-[10px] uppercase tracking-widest opacity-80">Préstamo</span>
    </div>
  </header>

  <main class="flex-grow p-4 flex flex-col items-center justify-center">
    <!-- Loading -->
    <div *ngIf="loading && !success" class="flex flex-col items-center">
      <div class="w-12 h-12 border-4 border-black border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-slate-500 font-medium">Cargando...</p>
    </div>

    <!-- Request Card -->
    <div *ngIf="!loading && libro && !success" class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden animate-in fade-in zoom-in duration-300">
      <div class="p-6 text-center">
        <!-- Badge -->
        <div class="mb-4 inline-flex items-center px-3 py-1 rounded-full text-xs font-bold border" 
             [class.bg-green-50]="hasStock" [class.text-green-800]="hasStock" [class.border-green-200]="hasStock"
             [class.bg-red-50]="!hasStock" [class.text-red-800]="!hasStock" [class.border-red-200]="!hasStock">
          <svg class="w-3 h-3 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><circle cx="10" cy="10" r="5"/></svg>
          {{ hasStock ? 'Disponible' : 'Sin Stock' }}
        </div>

        <!-- Cover -->
        <img [src]="portadaUrl" (error)="onImgError($event)" class="w-48 h-64 object-cover rounded-xl shadow-lg mx-auto mb-6" alt="Portada">

        <h2 class="text-2xl font-extrabold text-slate-900 mb-1 leading-tight">{{ libro.titulo }}</h2>
        <p class="text-slate-500 font-medium mb-6 text-sm">{{ libro.autor }}</p>

        <hr class="border-slate-100 mb-6">

        <!-- Actions -->
        <div class="space-y-4">
          <button (click)="confirmar()" [disabled]="submitting || !hasStock" 
                  class="w-full py-4 bg-black hover:bg-slate-800 disabled:bg-slate-300 text-white rounded-2xl font-bold text-lg shadow-md transition-all active:scale-[0.98] flex items-center justify-center">
            <span *ngIf="!submitting">Confirmar Préstamo</span>
            <div *ngIf="submitting" class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          </button>
          <button (click)="cancelar()" class="w-full py-3 text-slate-500 font-semibold text-sm hover:bg-slate-50 rounded-xl transition-colors">Cancelar</button>
        </div>
      </div>
    </div>

    <!-- Success -->
    <div *ngIf="success" class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8 text-center animate-in zoom-in duration-500">
      <div class="w-20 h-20 bg-green-50 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
      </div>
      <h1 class="text-2xl font-black text-slate-800 mb-2">¡Préstamo confirmado!</h1>
      <p class="text-black font-bold mb-6">{{ libro.titulo }}</p>
      <div class="bg-slate-50 p-4 rounded-xl mb-6">
        <p class="text-slate-600 text-sm">Ya puedes retirar el libro en la biblioteca.</p>
      </div>
      <button (click)="cerrar()" class="w-full py-4 bg-black hover:bg-slate-800 text-white rounded-xl font-bold shadow-lg transition-all active:scale-95">Cerrar</button>
    </div>
  </main>
</div>
