<div class="ciberbook-wrapper" [class.dark-theme]="themeService.isDarkTheme$ | async">
  <div class="dashboard-layout">
    
    <aside class="sidebar-coding" [class.open]="!isSidebarCollapsed">
      <div class="logo-details" (click)="isSidebarCollapsed ? toggleSidebar() : null" [title]="isSidebarCollapsed ? 'Expandir menú' : ''">
        <div class="brand-logo" (click)="!isSidebarCollapsed ? navigateTo('/admin/estadisticas') : null">
          <div class="logo-mark">
            <svg class="circuit-book-mini" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M20 10V32M20 10C16 8 8 9 5 11V31C8 29 16 28 20 32M20 10C24 8 32 9 35 11V31C32 29 24 28 20 32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="20" cy="7" r="2.5" fill="currentColor" />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">Ciber<span class="highlight">Book</span></span>
            <span class="brand-sub">BIBLIOTECA DIGITAL</span>
          </div>
        </div>
        <button type="button" class="btn-toggle-sidebar" id="btn" (click)="toggleSidebar(); $event.stopPropagation()" aria-label="Alternar menú lateral">
          <i class='bx bx-menu'></i>
        </button>
      </div>
      <ul class="nav-list">
        <div class="menu-label">MENÚ PRINCIPAL</div>
        @for (m of menu; track m.path) {
        <li>
          <a [class.active]="isActive(m.path)" (click)="navigateTo(m.path)">
            <i class='bx' [ngClass]="m.icon"></i>
            <span class="links_name">{{ m.name }}</span>
          </a>
          <span class="tooltip">{{ m.name }}</span>
        </li>
        }
        <li class="profile">
          <div class="profile-details">
            <div class="avatar">A</div>
            <div class="name_job">
              <div class="name">Administrador</div>
              <div class="job">Acceso total</div>
            </div>
          </div>
          <i class='bx bx-log-out' id="log_out" (click)="logout()" title="Cerrar Sesión"></i>
        </li>
      </ul>
    </aside>

    
    <div class="main-wrapper">
      
      <header class="topbar">
        <div class="topbar-content">
          <div class="page-info">
            <div class="info-text">
              <h1>Panel de Control</h1>
              <p>Gestiona eficientemente los recursos de CiberBook.</p>
            </div>
          </div>
          <div class="topbar-actions">
            <button class="theme-toggle-btn" (click)="toggleTheme()" [title]="(themeService.isDarkTheme$ | async) ? 'Modo Claro' : 'Modo Oscuro'">
              <span class="icon">{{ (themeService.isDarkTheme$ | async) ? '☀️' : '🌙' }}</span>
            </button>
          </div>
        </div>
      </header>

      
      <main class="content-area">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
