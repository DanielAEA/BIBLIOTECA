<div class="premium-container">
  <div class="premium-header">
    <h2>Gestión de Autores</h2>
    <button class="premium-button" (click)="createAutor()">+ Nuevo Autor</button>
  </div>

  <div class="filters-toolbar">
    <div class="filter-group search-filter">
      <i class='bx bx-search search-icon'></i>
      <input
        type="text"
        class="premium-input search-input"
        placeholder="Buscar autor por nombre..."
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchInput($event)"
        aria-label="Buscar autores"
      />
    </div>

    <div class="filter-group">
      <select class="premium-select" [(ngModel)]="sortOrder" (change)="onFilterChange()" aria-label="Ordenar autores">
        <option value="asc">Orden: A - Z</option>
        <option value="desc">Orden: Z - A</option>
      </select>
    </div>

    <div class="filter-group">
      <select class="premium-select" [(ngModel)]="filterLetter" (change)="onFilterChange()" aria-label="Filtrar por letra">
        <option value="">Todas las letras iniciales</option>
        <option *ngFor="let l of alphabet" [value]="l">Empieza por: {{ l }}</option>
      </select>
    </div>

    <button *ngIf="hasActiveFilters()" class="btn-clear-filters" (click)="clearFilters()" title="Limpiar todos los filtros">
      <i class='bx bx-x'></i> Limpiar
    </button>
  </div>

  <div class="modal-overlay" *ngIf="showForm" (click)="cancelForm()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ editingAutor ? 'Editar' : 'Crear' }} Autor</h3>
        <button class="close-btn" (click)="cancelForm()">✕</button>
      </div>
      <form (ngSubmit)="saveAutor()" class="premium-form">
        <div class="form-group">
          <label>Nombre:</label>
          <input type="text" [(ngModel)]="autorNombre" name="nombre" required placeholder="Ej. Gabriel García Márquez">
        </div>
        <div class="form-actions">
          <button type="submit" class="premium-button" [disabled]="submitting">
            {{ submitting ? 'Guardando...' : 'Guardar' }}
          </button>
          <button type="button" (click)="cancelForm()" class="premium-button premium-button-danger">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div *ngIf="loading" class="loading">Cargando autores...</div>

  <div class="bulk-actions" *ngIf="selectedAutorIds.size > 0">
    <span class="selected-count">
      <span class="badge-count">{{ selectedAutorIds.size }}</span> autor(es) seleccionado(s)
    </span>
    <button class="btn-delete-bulk" (click)="deleteSelectedAutores()">
      <i class='bx bx-trash'></i> Eliminar seleccionados
    </button>
  </div>

  <div class="premium-card" *ngIf="!loading && autores.length > 0">
    <div class="table-responsive">
      <table class="premium-table large-text">
        <thead>
          <tr>
            <th style="width: 44px; text-align: center;">
              <input type="checkbox" class="table-checkbox" (change)="toggleAll($event)" [checked]="isAllSelected()" aria-label="Seleccionar todos los autores">
            </th>
            <th>ID</th>
            <th>Nombre</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let a of autores" [class.row-selected]="selectedAutorIds.has(a.id)">
            <td style="width: 44px; text-align: center;">
              <input type="checkbox" class="table-checkbox" [checked]="selectedAutorIds.has(a.id)" (change)="toggleSelection(a.id)" aria-label="Seleccionar autor">
            </td>
            <td>{{ a.id }}</td>
            <td>{{ a.nombre }}</td>
            <td>
              <button class="btn-edit-premium sm" (click)="editAutor(a)">Editar</button>
              <button class="btn-delete-premium sm" (click)="deleteAutor(a)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination
      [page]="page"
      [size]="size"
      [totalElements]="totalElements"
      (pageChange)="onPageChange($event)"
      (sizeChange)="onSizeChange($event)"
    ></app-pagination>
  </div>

  <div *ngIf="!loading && autores.length === 0" class="no-data">
    {{ searchTerm ? 'No se encontraron autores con esa búsqueda.' : 'No hay autores registrados.' }}
  </div>
</div>
