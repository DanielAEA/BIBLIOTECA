<div class="premium-container">
  <div class="premium-header">
    <h2>Gestión de Géneros</h2>
    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
      <div class="search-box">
        <input
          type="text"
          class="premium-input search-input"
          placeholder="Buscar género por nombre..."
          [ngModel]="searchTerm"
          (ngModelChange)="onSearchInput($event)"
          aria-label="Buscar géneros"
        />
      </div>
      <button class="premium-button" (click)="createGenero()">+ Nuevo Género</button>
    </div>
  </div>

  <div class="modal-overlay" *ngIf="showForm" (click)="cancelForm()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ editingGenero ? 'Editar' : 'Crear' }} Género</h3>
        <button class="close-btn" (click)="cancelForm()">✕</button>
      </div>
      <form (ngSubmit)="saveGenero()" class="premium-form">
        <div class="form-group">
          <label>Nombre:</label>
          <input type="text" [(ngModel)]="generoNombre" name="nombre" required placeholder="Ej. Realismo Mágico">
        </div>
        <div class="form-actions">
          <button type="submit" class="premium-button" [disabled]="submitting">
            {{ submitting ? 'Guardando...' : 'Guardar' }}
          </button>
          <button type="button" (click)="cancelForm()" class="premium-button premium-button-danger">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div *ngIf="loading" class="loading">Cargando géneros...</div>

  <div class="bulk-actions" *ngIf="selectedGeneroIds.size > 0">
    <span class="selected-count">
      <span class="badge-count">{{ selectedGeneroIds.size }}</span> género(s) seleccionado(s)
    </span>
    <button class="btn-delete-bulk" (click)="deleteSelectedGeneros()">
      <i class='bx bx-trash'></i> Eliminar seleccionados
    </button>
  </div>

  <div class="premium-card" *ngIf="!loading && generos.length > 0">
    <div class="table-responsive">
      <table class="premium-table large-text">
        <thead>
          <tr>
            <th style="width: 44px; text-align: center;">
              <input type="checkbox" class="table-checkbox" (change)="toggleAll($event)" [checked]="isAllSelected()" aria-label="Seleccionar todos los géneros">
            </th>
            <th>ID</th>
            <th>Nombre</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let g of generos" [class.row-selected]="selectedGeneroIds.has(g.id)">
            <td style="width: 44px; text-align: center;">
              <input type="checkbox" class="table-checkbox" [checked]="selectedGeneroIds.has(g.id)" (change)="toggleSelection(g.id)" aria-label="Seleccionar género">
            </td>
            <td>{{ g.id }}</td>
            <td>{{ g.nombre }}</td>
            <td>
              <button class="btn-edit-premium sm" (click)="editGenero(g)">Editar</button>
              <button class="btn-delete-premium sm" (click)="deleteGenero(g)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination
      [page]="page"
      [size]="size"
      [totalElements]="totalElements"
      (pageChange)="onPageChange($event)"
      (sizeChange)="onSizeChange($event)"
    ></app-pagination>
  </div>

  <div *ngIf="!loading && generos.length === 0" class="no-data">
    {{ searchTerm ? 'No se encontraron géneros con esa búsqueda.' : 'No hay géneros registrados.' }}
  </div>
</div>
